[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wraith-crawler"
version = "0.2.0"
description = "Evidence-first external web application security assessment platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Wraith Crawler Contributors" }]
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "PyJWT>=2.9,<3",
  "PyYAML>=6,<7",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "pypdf>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.scripts]
wraith-crawler = "wraith_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wraith_crawler"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
